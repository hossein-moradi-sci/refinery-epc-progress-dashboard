/* -------------------------------- the table --------------------------------
   The full item list again (heaviest first), for whatever scope is on screen:
   the whole filtered project at the top level, or the drilled subtree after a
   drill. The chips and slicers above narrow it; the table itself stays a list
   of leaf items — the drill happens on the charts and the breadcrumb. */
/* The list is VIRTUALIZED: only the rows inside the scroll window (plus a small
   over-scan) ever exist in the DOM, with two spacer rows keeping the scrollbar
   honest. That is what keeps scrolling — and the row cascade — smooth with 226
   items or while a filter is being typed: the browser lays out ~15 rows instead
   of 226. Every row is exactly `--rowh` tall (see the CSS), so the window math
   is exact; the name clamps to two lines and keeps its full text in `title`. */
let RENDER_N = 0;       // render counter — what the print sheet was built from
let LAST_CTX = null;    // the context the last render() drew (charts + print sheet)
let LAST_TABLE_T = 0;   // when the last table paint happened (typing guard)
let ROWH = 0;           // cached row height (the CSS --rowh); 0 = not read yet
const TVIEW = { rows: [], data: '', win: '', raf: 0, seen: 0, status: null };   // seen = the wrap's visible height; status = the scope's status date (the dots need it)
const ROW_OVERSCAN = 6; // rows kept in the DOM outside the visible window

/* each progress line carries its own percentage, printed in that line's colour,
   and the pair sits directly beside the item name */
const pline = (v, color) =>
  '<div class="pline">' + track(v, color) +
  '<span class="pv num" style="color:' + color + '">' + pct1(v) + '</span></div>';
function rowHeight() {
  if (!ROWH) {
    const v = parseFloat(getComputedStyle($('itemsBody')).getPropertyValue('--rowh'));
    ROWH = v > 24 ? v : 80;             // a sane fallback if the CSS ever changes
  }
  return ROWH;
}
function tableRowHTML(r, i, anim) {
  const a = num(r.ActualPercent), pl = num(r.PlannedPercent);
  const sub = [r.Disciplines || '', phaseName(r.Phase || '')].filter(Boolean).join(' \u00b7 ');
  const st = catOf(r, TVIEW.status || statusDate(DATA.tasks));
  const crit = r.Critical === 'True';
  return '<tr' + (anim ? ' style="--i:' + Math.min(i, 18) + '"' : '') + (crit ? ' class="crit"' : '') + '>' +
    '<td class="tname"><span class="nm" title="' + esc(r.TaskName) + '">' + esc(r.TaskName) + '</span>' +
    '<span class="st num" style="--c:' + (CATS.find((x) => x.k === st) || {}).color + '" title="' + esc(catLabel(st)) + '">' + esc(catLabel(st)) + '</span>' +
    (sub ? '<span class="sub" title="' + esc(sub) + '">' + esc(sub) + '</span>' : '') + '</td>' +
    '<td class="prog-cell">' + pline(a, C_ACT) + pline(pl, C_PLAN) + '</td>' +
    '<td class="num">' + num(r.WeightPercent).toFixed(2) + '</td></tr>';
}
/* paint the window the scroll container can currently see (plus the over-scan) */
function tablePaint(anim, force) {
  const body = $('itemsBody');
  if (!body) return;
  const t = I18N[LANG];
  const rows = TVIEW.rows;
  const wrap = document.querySelector('.tablewrap');
  body.classList.toggle('anim', !!anim);
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="3"><div class="empty">' + esc(t.empty) + '</div></td></tr>';
    TVIEW.win = '';
    return;
  }
  const rowh = rowHeight();
  const top = wrap ? wrap.scrollTop : 0;
  /* the visible height is CACHED (the ResizeObserver keeps it current): reading
     clientHeight here would force a synchronous layout on every scroll frame */
  const seen = TVIEW.seen || 560;
  const from = Math.max(0, Math.floor(top / rowh) - ROW_OVERSCAN);
  const to = Math.min(rows.length, Math.ceil((top + seen) / rowh) + ROW_OVERSCAN);
  const sig = from + ':' + to + ':' + rows.length;
  if (!force && sig + (anim ? 'a' : '') === TVIEW.win) return;   // already on screen
  TVIEW.win = sig + (anim ? 'a' : '');
  const spacer = (h) => (h > 0 ? '<tr class="sp" aria-hidden="true"><td colspan="3" style="height:' + h + 'px"></td></tr>' : '');
  let html = spacer(from * rowh);
  for (let i = from; i < to; i++) html += tableRowHTML(rows[i], i - from, anim);
  html += spacer((rows.length - to) * rowh);
  body.innerHTML = html;
}
/* printing has no scroll window: hand the paper version every row */
function tablePaintAll() {
  const body = $('itemsBody');
  if (!body || !TVIEW.rows.length) return;
  body.classList.remove('anim');
  body.innerHTML = TVIEW.rows.map((r, i) => tableRowHTML(r, i, false)).join('');
  TVIEW.win = '';
}
function renderTable(node) {
  const t = I18N[LANG];
  const rows = node.leaves.slice().sort((a, b) => num(b.WeightPercent) - num(a.WeightPercent));
  /* the critical-path toggle exists only when the data carries the flag (the
     exporter writes the Critical column; older CSVs predate it) */
  const bc = $('btnCrit');
  if (bc) {
    bc.style.display = critAvailable() ? '' : 'none';
    bc.classList.toggle('on', FIL.crit);
    bc.disabled = !rows.length && FIL.crit;
  }
  const scope = $('tableScope');
  if (scope) {
    scope.textContent = (node.level ? node.name + ' \u00b7 ' : '') + rows.length + ' ' + t.items +
      (filterActive() ? ' \u00b7 ' + t.filters : '');
  }
  $('count').textContent = rows.length ?
    rows.length + ' ' + t.items + (node.level ? ' \u2014 ' + node.name : '') : '';
  /* the rows cascade only on a real data change — typing in the search box (or
     any other back-to-back re-render) must not restart the animation */
  const now = performance.now();
  const cascade = !LAST_TABLE_T || now - LAST_TABLE_T > 320;
  LAST_TABLE_T = now;
  /* a new scope — another filter, a drill, another language — starts at the top */
  const sig = node.key + '|' + rows.length + '|' + (rows[0] ? rows[0].UniqueID : '') + '|' + LANG;
  if (sig !== TVIEW.data) {
    TVIEW.data = sig;
    const wrap = document.querySelector('.tablewrap');
    if (wrap) wrap.scrollTop = 0;
  }
  TVIEW.rows = rows;
  TVIEW.status = statusDate(DATA.tasks);
  tablePaint(cascade, true);
}
/* one passive scroll listener (rAF-throttled) drives the windowed repaint, so a
   scroll never costs more than one paint per frame */
(function tableScroll() {
  const wrap = document.querySelector('.tablewrap');
  if (!wrap) return;
  const kick = () => {
    if (TVIEW.raf) return;
    TVIEW.raf = requestAnimationFrame(() => { TVIEW.raf = 0; tablePaint(false, false); });
  };
  const measure = () => { TVIEW.seen = wrap.clientHeight; kick(); };
  wrap.addEventListener('scroll', kick, { passive: true });
  addEventListener('resize', measure, { passive: true });
  /* the wrap is sized by layout (its own first paint, the reveal, a theme), not
     only by the window — so watch IT and repaint when its viewport changes. The
     window-signature guard makes the echo of a repaint a no-op. */
  if (typeof ResizeObserver === 'function') new ResizeObserver(measure).observe(wrap);
  else measure();
  addEventListener('beforeprint', tablePaintAll);
  addEventListener('afterprint', () => tablePaint(false, true));
})();

/* ========================= print / PDF meeting sheet =========================
   One clean A4 page for a meeting: heading + the KPI strip + the S-curve + as
   many of the heaviest items as still fit. The sheet lives off-screen all the
   time (#printSheet), so it can be MEASURED while it is built — rows are added
   one at a time until the page is full, and the footer says how many of the
   scope's items are on paper. It is rebuilt on demand (the button, Ctrl+P, the
   P key) and only when something it shows actually changed. */
const PS_PAGE_H = 1000;   // A4 content height is ~1047 px at 96 dpi; the slack covers
                          // the printer's own margins, so one page never becomes two
let PS_SIG = '';

function psRow(r) {
  const a = num(r.ActualPercent), p = num(r.PlannedPercent);
  /* the name is shortened in the STRING, not with a CSS ellipsis: the sheet is
     RTL, and a clipped LTR run puts the "…" on the wrong side of the name */
  const nm = r.TaskName.length > 60 ? r.TaskName.slice(0, 59) + '…' : r.TaskName;
  /* the same status dot as the on-screen table (a coloured bullet, no text —
     the sheet stays scannable at one glance) */
  const st = catOf(r, statusDate(DATA.tasks));
  const dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' +
    ((CATS.find((x) => x.k === st) || {}).color || 'var(--muted)') + ';margin-inline-end:6px;vertical-align:0"></span>';
  return '<tr><td class="ps-nm" title="' + esc(r.TaskName) + '">' + dot + esc(nm) + '</td>' +
    '<td class="num">' + num(r.WeightPercent).toFixed(2) + '</td>' +
    '<td><span class="ps-cell"><b class="num" style="color:var(--green)">' + pct1(a) + '</b>' +
      '<span class="ps-bar"><i style="width:' + (Math.min(100, a * 100)).toFixed(1) + '%;background:var(--green)"></i></span></span></td>' +
    '<td class="num" style="color:var(--blue);font-weight:800">' + pct1(p) + '</td></tr>';
}
function buildPrintSheet() {
  const sheet = $('printSheet');
  if (!sheet || !DATA || !TREE || !LAST_CTX) return;
  const t = I18N[LANG];
  const node = TREE.get(FOCUS) || TREE.get('');
  const rows = TVIEW.rows;
  const filters = filterChipList().map((c) => c.label);
  const cmp = cmpStateFor(node);
  /* the sheet is a picture of the last render: a new render (or a new export)
     means rebuild, anything else means the sheet on disk is still current */
  const sig = RENDER_N + '|' + (DATA.stamp || '');
  if (sig === PS_SIG && sheet.childElementCount) return;
  PS_SIG = sig;
  const s = nodeStats(node);
  const ctx = LAST_CTX;
  const kpi = (k, v, color, extra) => '<div class="ps-kpi"><div class="k">' + esc(k) + '</div>' +
    '<div class="v num" style="color:' + color + '">' + esc(v) + '</div>' + (extra || '') + '</div>';
  const delta = cmp ? '<div class="d num">' + esc(t.cmpDReal) + ' ' + esc(cmpPP(cmp.dA)) +
    ' · ' + esc(t.cmpDPlan) + ' ' + esc(cmpPP(cmp.dP)) + '</div>' : '';
  sheet.innerHTML =
    '<div class="ps-head">' +
      '<div><h1>' + esc(t.title) + '</h1><div class="ps-sub">' + esc(t.prSheet) + ' · ' + esc(t.sub) + '</div></div>' +
      '<div class="ps-meta num">' +
        '<div>' + esc(t.scNow) + ': <b>' + esc(fmtDay(ctx.status, true)) + '</b></div>' +
        '<div>' + esc(t.lastSync) + ': <b>' + esc(DATA.stamp || '—') + '</b></div>' +
        '<div>' + esc(t.prScope) + ': <b>' + esc(node.level ? node.name : t.drillAll) + ' · ' + rows.length + ' ' + esc(t.items) + '</b></div>' +
        '<div>' + esc(t.prFilters) + ': <b>' + esc(filters.length ? filters.join('، ') : t.prNone) + '</b></div>' +
      '</div>' +
    '</div>' +
    '<div class="ps-kpis">' +
      kpi(t.kActual, pct1(s.actual), 'var(--green)', delta) +
      kpi(t.kPlanned, pct1(s.planned), 'var(--blue)') +
      kpi(t.kVar, (s.variance >= 0 ? '+' : '') + (100 * s.variance).toFixed(1) + 'pp', s.variance >= 0 ? 'var(--green)' : 'var(--red)') +
      kpi(t.kMile, catsOf(ctx.miles, ctx.status).done + ' / ' + ctx.miles.length, 'var(--violet)') +
    '</div>' +
    '<div class="ps-chart" id="psChart"></div>' +
    '<table><thead><tr><th>' + esc(t.thName) + '</th><th>' + esc(t.thWeight) + '</th><th>' + esc(t.gaugeActual) +
      '</th><th>' + esc(t.gaugePlanned) + '</th></tr></thead><tbody id="psRows"></tbody></table>' +
    '<div class="ps-foot"><span id="psNote" class="num"></span><span>' + esc(t.prSource) + ' · ' + esc(fmtDay(new Date(), true)) + '</span></div>';
  /* the S-curve is rendered INTO the sheet (whatever the chart picker shows on
     screen), so the page always carries it; then the drawn-in animation is
     dropped — on paper the lines must simply be there */
  const ch = $('psChart');
  try {
    chartSCurve(ch, ctx);
    const svg = ch.querySelector('svg.sc');
    /* only the draw-in values are dropped: the whole style attribute also holds
       the font-size the chart fitted to its width, and the sheet needs that */
    if (svg) { svg.classList.remove('draw'); svg.style.removeProperty('--plen'); svg.style.removeProperty('--alen'); }
    ch.querySelectorAll('.tt').forEach((e) => e.remove());
    const lg = ch.querySelector('.sc-legend');
    if (lg) lg.classList.add('ps-legend');
  } catch (e) { /* a chart must never block the sheet */ }
  /* fill the page: add rows until another one would spill onto a second sheet */
  const tbody = $('psRows');
  let shown = 0;
  for (; shown < rows.length; shown++) {
    tbody.insertAdjacentHTML('beforeend', psRow(rows[shown]));
    if (sheet.offsetHeight > PS_PAGE_H) { tbody.lastElementChild.remove(); break; }
  }
  $('psNote').textContent = shown < rows.length
    ? shown + ' / ' + rows.length + ' ' + t.items + ' · ' + t.prRest
    : rows.length + ' ' + t.items;
}
/* the button (and the P key) prints the ONE-PAGE sheet; a plain Ctrl+P still
   prints the dashboard itself, so nothing the user had before is taken away */
function printSheet() {
  buildPrintSheet();
  SFX.click();
  document.documentElement.classList.add('printsheet');
  window.print();
  /* afterprint clears the class; the timer is only a safety net for a browser
     that never fires it (the class must not stick to a later Ctrl+P) */
  setTimeout(() => document.documentElement.classList.remove('printsheet'), 180000);
}
if ($('btnPrint')) $('btnPrint').onclick = printSheet;
addEventListener('beforeprint', buildPrintSheet);
addEventListener('afterprint', () => document.documentElement.classList.remove('printsheet'));

/* `quiet` is kept for call sites that used to suppress the "synced" message:
   re-rendering from a slicer / drill / theme change must NOT look like a sync. */
function render(quiet) { // eslint-disable-line no-unused-vars
  if (!DATA) return;
  const t = I18N[LANG];
  const status = statusDate(DATA.tasks);
  const tasks = applyFilters(DATA.tasks);
  TREE = buildTree(applyTop(tasks.filter(isLeaf)));
  if (FOCUS && !TREE.has(FOCUS)) FOCUS = '';
  const node = TREE.get(FOCUS) || TREE.get('');
  const miles = tasks.filter(isMilestone);
  const milesAll = applyFilters(DATA.tasks, { ignoreStatus: true }).filter(isMilestone);
  renderKpis(node, milesIn(node, miles));
  renderRag(node, status);
  renderLookahead(node, status);
  renderFocus();
  renderFilters();
  renderPick();
  renderCmp();
  /* the ctx every chart (and the print sheet's own S-curve) renders from */
  LAST_CTX = { node, status, miles: milesIn(node, milesAll), s: nodeStats(node), milesAll };
  renderCharts(LAST_CTX);
  renderTable(node);
  $('stamp').textContent = DATA.stamp ? t.lastSync + ': ' + DATA.stamp : '';
  RENDER_N++;
}

/* ============================== ui wiring ============================== */
/* ---- the filter drawer: tabs + the collapsible body (rebuilt per language) ---- */
const FLU_TABS = [
  { id:'basic',  lbl:'fltTabBasic' },
  { id:'num',    lbl:'fltTabNum' },
  { id:'time',   lbl:'fltTabTime' },
];
let FLU_TAB = localStorage.getItem('fgr-ftab') || 'basic';
if (!FLU_TABS.some((x) => x.id === FLU_TAB)) FLU_TAB = 'basic';
function paintFilterDrawer() {
  const t = I18N[LANG];
  const tabs = $('fltTabs'), body = $('fltBody');
  if (!tabs || !body) return;
  tabs.innerHTML = FLU_TABS.map((x) =>
    '<button class="tab' + (FLU_TAB === x.id ? ' on' : '') + '" role="tab" aria-selected="' + (FLU_TAB === x.id) + '" data-t="' + x.id + '">' +
    esc(t[x.lbl]) + '<i class="tnoise"></i></button>').join('');
  tabs.querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => {
      if (FLU_TAB === b.dataset.t) return;
      FLU_TAB = b.dataset.t;
      try { localStorage.setItem('fgr-ftab', FLU_TAB); } catch {}
      paintFilterDrawer();
      SFX.click();
    };
  });
  if (FLU_TAB === 'basic') {
    body.innerHTML =
      '<div class="fld"><label data-i18n="fltPhase"></label><div class="ms" id="msPhase"></div></div>' +
      '<div class="fld"><label data-i18n="fltDisc"></label><div class="ms" id="msDisc"></div></div>' +
      '<div class="fld"><label data-i18n="fltStatus"></label><div class="ms" id="msStatus"></div></div>' +
      '<div class="fld fld-q"><label data-i18n="fltSearch"></label><input class="inp" type="search" id="fltQuery" data-i18n-ph="fltSearch"></div>';
    msInit('msPhase'); msInit('msDisc'); msInit('msStatus');
    $('fltQuery').oninput = () => { FIL.q = $('fltQuery').value; render(); };
  } else if (FLU_TAB === 'num') {
    body.innerHTML =
      '<div class="fld"><label data-i18n="fltNumField"></label><select class="inp" id="numField"></select></div>' +
      '<div class="fld"><label data-i18n="fltNumOp"></label><select class="inp" id="numOp"></select></div>' +
      '<div class="fld"><label data-i18n="fltNumVal"></label><input class="inp num" id="numVal" inputmode="decimal" placeholder="e.g. 50"></div>' +
      '<div class="fld" id="numVal2Wrap" style="display:none"><label data-i18n="fltNumVal2"></label><input class="inp num" id="numVal2" inputmode="decimal" placeholder="e.g. 80"></div>' +
      '<div class="fld"><label>&nbsp;</label><button class="btn" id="btnAddRule" data-i18n="fltAddRule"></button></div>' +
      '<div class="rule-wrap" id="ruleWrap"></div>' +
      '<div class="rel-note" data-i18n="fltNumHint"></div>';
    $('numOp').onchange = () => { $('numVal2Wrap').style.display = $('numOp').value === 'between' ? '' : 'none'; SFX.click(); };
    $('btnAddRule').onclick = addNumRule;
  } else {
    body.innerHTML =
      '<div class="fld"><label data-i18n="fltFrom"></label><input class="inp num" type="date" id="fltFrom"></div>' +
      '<div class="fld"><label data-i18n="fltTo"></label><input class="inp num" type="date" id="fltTo"></div>' +
      '<div class="fld"><label data-i18n="fltRel"></label>' +
        '<div class="rel"><select class="inp" id="relDir"></select><input class="inp num n" id="relN" type="number" min="1" max="999" value="3"><select class="inp" id="relUnit"></select></div></div>' +
      '<div class="fld"><label data-i18n="fltTop"></label>' +
        '<div class="rel"><select class="inp" id="topBy"></select><input class="inp num n" id="topN" type="number" min="0" max="9999" value="10"><button class="btn" id="btnApplyTop" data-i18n="fltApply"></button></div></div>';
    $('fltFrom').onchange = () => { FIL.from = $('fltFrom').value; render(); };
    $('fltTo').onchange = () => { FIL.to = $('fltTo').value; render(); };
    $('relDir').onchange = applyRel;
    $('relUnit').onchange = applyRel;
    $('relN').onchange = () => { if (FIL.rel || $('relN').value) applyRel(); };
    $('btnApplyTop').onclick = applyTopUI;
    $('topBy').onchange = () => { if (FIL.top) { FIL.top.by = $('topBy').value; SFX.click(); render(); } };
  }
  renderFilters();
  applyI18n(body);          // the tab was just built: paint its labels/buttons now
}
function filterDrawerOpen(on) {
  const card = document.querySelector('.filters'), btn = $('btnFilters');
  if (!card) return;
  card.classList.toggle('open', on);
  if (btn) btn.setAttribute('aria-expanded', on ? 'true' : 'false');
}
$('btnFilters').onclick = () => {
  const on = !document.querySelector('.filters').classList.contains('open');
  filterDrawerOpen(on);
  if (on) paintFilterDrawer();
  SFX.click();
};

$('btnClear').onclick = () => {
  FIL.phases.length = 0; FIL.disc.length = 0; FIL.status.length = 0;
  FIL.from = ''; FIL.to = ''; FIL.q = '';
  FIL.num.length = 0; FIL.rel = null; FIL.top = null; FIL.crit = false;
  SFX.swish(); render();
};
/* ---- advanced filter controls (rendered inside the drawer's tabs) ---- */
function addNumRule() {
  if (!$('numField') || !$('numVal')) return;   // its tab is not open
  const f = $('numField').value, op = $('numOp').value;
  const pct = !!(NUM_FIELDS.find((x) => x.k === f) || {}).pct;
  const raw = parseFloat($('numVal').value), raw2 = parseFloat($('numVal2').value);
  if (!isFinite(raw)) { $('numVal').focus(); return; }
  const conv = (x) => (pct ? x / 100 : x);
  FIL.num.push({ f, op, v: conv(raw), v2: isFinite(raw2) ? conv(raw2) : conv(raw) });
  $('numVal').value = ''; $('numVal2').value = '';
  SFX.pop();
  render();
}
function applyRel() {
  if (!$('relN') || !$('relDir')) return;   // its tab is not open
  const n = Math.max(1, Math.min(999, parseInt($('relN').value, 10) || 1));
  FIL.rel = { dir: $('relDir').value, n, unit: $('relUnit').value };
  SFX.click();
  render();
}
function applyTopUI() {
  if (!$('topN') || !$('topBy')) return;   // its tab is not open
  const n = Math.max(0, Math.min(9999, parseInt($('topN').value, 10) || 0));
  FIL.top = n ? { n, by: $('topBy').value } : null;
  SFX.pop();
  render();
}
$('btnPick').onclick = (e) => {
  e.stopPropagation();
  const pop = $('pickPop'), open = !pop.classList.contains('open');
  closePops();
  pickOpen(open);
  SFX.click();
};
/* the compare pop-over is click-only: it carries controls, so it must not spring
   open while the pointer merely passes over it on the way to the chart picker */
$('btnCmp').onclick = (e) => {
  e.stopPropagation();
  const pop = $('cmpPop'), open = !pop.classList.contains('open');
  closePops();
  cmpOpen(open);
  SFX.click();
};
/* hover the Charts button ("when I move onto it") and the menu springs open;
   move away and it folds back, with a short grace period on both ends */
(function pickHover() {
  const wrap = $('btnPick') ? $('btnPick').closest('.pick-wrap') : null;
  if (!wrap) return;
  wrap.addEventListener('mouseenter', () => { pickCancel(); PICK_T.push(setTimeout(() => pickOpen(true), 110)); });
  wrap.addEventListener('mouseleave', () => { pickCancel(); PICK_T.push(setTimeout(() => pickOpen(false), 340)); });
})();
document.addEventListener('pointerdown', (e) => {
  if (!e.target || !e.target.closest) { closePops(); return; }
  if (!e.target.closest('.ms, .pick-wrap, .drillwrap')) closePops();
});

function showErr(e) {
  const el = $('err');
  const offline = !SERVER && location.protocol === 'file:';
  el.innerHTML = offline ? esc(I18N[LANG].stOffline)
    : esc(I18N[LANG].loadErr) + (e && e.message ? ' — ' + esc(e.message) : '');
  el.style.display = 'block';
  setState(offline ? 'stOffline' : 'loadErr', 'err');
}

/* ============================== server api ============================== */
async function probeServer() {
  try { SERVER = (await fetch('/api/health', { cache: 'no-store' })).ok; }
  catch { SERVER = false; }
  $('btnSync').disabled = !SERVER;
  return SERVER;
}

/* one button does everything: read MS Project, rewrite the CSVs, reload */
$('btnSync').onclick = async () => {
  if (!SERVER || BUSY) return;
  BUSY = true;
  const t = I18N[LANG];
  $('btnSync').classList.add('busy');
  $('btnSync').disabled = true;
  setState('stSyncing', 'busy');
  try {
    const j = await (await fetch('/api/sync', { method: 'POST', cache: 'no-store' })).json();
    if (j.ok) {
      const d = await loadData();
      DATA = d;
      $('err').style.display = 'none';
      render(true);
      setState('stSynced', 'ok', true);
      SFX.chime();
    } else {
      setState('stFailed', 'err', false, ': ' + (j.message || ''));
      SFX.buzz();
    }
  } catch (e) {
    /* the single failure a manual-only page must explain: the local app that
       answers /api/sync is no longer running (tab left open for hours, machine
       slept). Say so instead of showing a raw fetch error. */
    await probeServer();
    if (SERVER) setState('stFailed', 'err', false, ': ' + e.message);
    else setState('stGone', 'err');
    SFX.buzz();
  } finally {
    BUSY = false;
    $('btnSync').classList.remove('busy');
    $('btnSync').disabled = !SERVER;
  }
};

/* ============================ premium motion layer ============================
   One place for the pointer-driven polish. Rule of thumb: nothing here may be
   required for content to become visible — a frame callback that never runs
   (non-composited preview, background tab) must only cost the *motion*, never
   the numbers. So the spotlight/parallax write CSS variables and the reveal
   arms itself with an observer + a safety net. */
const MOTION_REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function motionInit() {
  if (MOTION_REDUCED) { document.documentElement.classList.add('calm'); return; }

  /* 1. pointer spotlight (--mx/--my on the hovered card) + ambient parallax
        (--px/--py on the root, read by `.bg`) — one throttled frame at most */
  let queued = false, nx = 0, ny = 0, cx = 50, cy = 42, card = null;
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    nx = (e.clientX / innerWidth) * 2 - 1;
    ny = (e.clientY / innerHeight) * 2 - 1;
    card = e.target && e.target.closest ? e.target.closest('.kpi, .card') : null;
    if (card) {
      const r = card.getBoundingClientRect();
      cx = clamp01((e.clientX - r.left) / Math.max(1, r.width)) * 100;
      cy = clamp01((e.clientY - r.top) / Math.max(1, r.height)) * 100;
    }
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const st = document.documentElement.style;
      st.setProperty('--px', nx.toFixed(3));
      st.setProperty('--py', ny.toFixed(3));
      if (card) {
        card.style.setProperty('--mx', cx.toFixed(1) + '%');
        card.style.setProperty('--my', cy.toFixed(1) + '%');
      }
    });
  }, { passive: true });

  /* 2. scroll progress hairline */
  const fill = $('topbarFill');
  const onScroll = () => {
    if (!fill) return;
    const h = document.documentElement.scrollHeight - innerHeight;
    fill.style.width = (h > 8 ? clamp01(scrollY / h) * 100 : 0).toFixed(2) + '%';
  };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll, { passive: true });
  onScroll();

  /* 2b. the filter command row pins itself under the hairline once the page
     scrolls past it; a spacer keeps the layout from jumping */
  const bar = $('filterBar');
  if (bar) {
    const spacer = document.createElement('div');
    spacer.className = 'pin-spacer';
    bar.after(spacer);
    let until = 0;                              // grace period after adopt/unadopt
    /* the pop-overs follow the bar when it is adopted by <body> (and go home on
       release) — otherwise an open menu would be left hanging inside a layer
       that is no longer where its button lives */
    const rehost = () => { popHost($('pickPop'), $('btnPick')); popHost($('cmpPop'), $('btnCmp')); };
    const pin = () => {
      /* the card behind the bar carries `backdrop-filter`, which makes it the
         containing block for fixed descendants — so while pinned the bar is
         ADOPTED by <body> and the spacer keeps its place in the card */
      if (performance.now() < until) return;
      const pinnedNow = bar.classList.contains('pinned');
      if (pinnedNow) {
        const sTop = spacer.getBoundingClientRect().top;
        if (sTop > 8 || spacer.offsetHeight === 0) {
          bar.classList.remove('pinned');
          bar.style.width = '';
          spacer.style.height = '0';
          document.querySelector('.filters').insertBefore(bar, spacer);
          rehost();
          until = performance.now() + 350;
        }
        return;
      }
      const r = bar.getBoundingClientRect();
      if (r.top < 8) {
        spacer.style.height = r.height + 'px';
        bar.style.width = r.width + 'px';
        document.body.appendChild(bar);          // escapes the containing block
        bar.classList.add('pinned');
        rehost();
        until = performance.now() + 350;
      }
    };
    /* capture phase on window: the adopted bar's own scroll positions differ */
    addEventListener('scroll', pin, { passive: true, capture: true });
    addEventListener('resize', pin, { passive: true });
    pin();
  }

  /* 3. scroll reveal for the sections that start below the fold. The observer
        decides; a safety net (only if the observer never reports at all) makes
        sure nothing can stay hidden. */
  requestAnimationFrame(() => {
    const els = [...document.querySelectorAll('.wrap > .card')]
      .filter((el) => el.getBoundingClientRect().top > innerHeight * 0.82);
    if (!els.length) return;
    els.forEach((el) => el.classList.add('rv'));
    const show = (el) => { el.classList.remove('rv'); el.classList.add('rv-in'); };
    if (!('IntersectionObserver' in window)) { els.forEach(show); return; }
    const io = new IntersectionObserver((ents) => {
      ents.forEach((en) => { if (en.isIntersecting) { show(en.target); io.unobserve(en.target); } });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 });
    els.forEach((el) => io.observe(el));
    /* Content safety net: after a few seconds everything is shown no matter what
       the observer did (an environment that never paints a frame would otherwise
       leave these sections hidden for good). Scrolling earlier still gets the
       animation — afterwards the section is simply already there. */
    setTimeout(() => els.forEach(show), 4000);
  });
}

/* ============================== boot ============================== */
applyTheme(localStorage.getItem('fgr-theme') || 'mid', true);
setLang(localStorage.getItem('fgr-lang') === 'en' ? 'en' : 'fa', true);
renderSound();
splashInit();

probeServer().then((ok) => {
  setState(ok ? 'stReady' : 'stOffline', ok ? 'ok' : 'err');
  if (ok) ping();          // the launcher serves the data AND answers /api/sync
});

loadData().then((d) => {
  DATA = d;
  $('err').style.display = 'none';
  render(true);
  paintState();           // with data on screen the status also states the update policy
  tkBuild(true);          // the one data-aware tip may join the run now
  /* the page is only "ready" once real numbers are on screen: the KPI values
     pop and the below-the-fold sections arm their scroll reveal from here */
  document.documentElement.classList.add('ready');
  motionInit();
}).catch(showErr);

/* Nothing here re-reads the data on its own: a fresh export happens only when the
   user presses “Update from MS Project”. The single timer below is the launcher
   heartbeat, which reads nothing and changes nothing on screen. */

/* heartbeat: the launcher exe shuts itself down ~3 minutes after the page stops
   talking to it (Scripts/Dashboard.cs, FGR_IDLE_SECONDS), and that would take the
   local server away from the update button and from a plain reload. So the page
   sends one tiny POST on load, again whenever the tab comes back into view, and at
   most once a minute otherwise — a 3× margin on that idle limit even when the
   browser throttles timers in a hidden tab. */
function ping() { if (SERVER) fetch('/api/ping', { method: 'POST', cache: 'no-store' }).catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) ping(); });
setInterval(ping, 60000);
</script>

<!-- the one-page meeting sheet: filled on demand (button / Ctrl+P) and shown only
     by the print stylesheet; it is laid out off-screen so it can be measured -->
<section id="printSheet" class="ps" aria-hidden="true"></section>
</body>
</html>
