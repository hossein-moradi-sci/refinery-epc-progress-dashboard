  .btn:active, .dbtn:active, .crumb:active, .fchip:active, .seg button:active { transform:translateY(1px) scale(.975); }
  .seg button.on { box-shadow:0 6px 18px -10px var(--a1); }

  /* printing must never meet a section that is waiting to be revealed */
  /* ================== print / PDF sheet (one clean A4 page) ==================
     A self-contained "meeting sheet": heading, the four KPIs, the S-curve and as
     many of the heaviest items as still fit ONE A4 page (see buildPrintSheet).
     It is laid out off-screen with `position:fixed` — that keeps it out of the
     page's scroll area while still letting the page MEASURE how many rows fit
     (a `display:none` sheet could not be measured). Printing shows it alone.
     Its palette is the light "paper" theme copied onto the sheet, so a dark
     dashboard still prints a clean, ink-light page; the S-curve is rendered
     inside the sheet, so it picks these colours up (CSS variables resolve where
     the element actually sits in the tree). */
  #printSheet {
    position:fixed; top:0; inset-inline-start:-120vw; width:718px; z-index:-1; visibility:hidden;
    --panelA:#fff; --panelB:#fff; --glass:#fff; --line:#c9d3e0; --soft:#e4e9f0; --track:#eef2f7;
    --text:#111827; --muted:#5b6b82; --a1:#1d4ed8; --a2:#7c2d12; --chipBg:#eef2f7; --hover:#f1f5f9;
    --green:#15803d; --blue:#1d4ed8; --red:#b91c1c; --amber:#a16207; --violet:#6d28d9;
    color:var(--text); background:#fff; font-size:12.5px; line-height:1.5;
  }
  /* paper is a still image: no entrance animation may leave a line or a mark
     half-drawn (the S-curve is de-drawn by dropping its `.draw` class too) */
  #printSheet * { animation:none !important; }
  #printSheet .ps-head { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; border-bottom:2px solid var(--a1); padding-bottom:9px; }
  #printSheet .ps-head h1 { font-size:19px; margin:0; line-height:1.35; }
  #printSheet .ps-sub { color:var(--muted); font-size:11.5px; margin-top:4px; }
  #printSheet .ps-meta { text-align:end; color:var(--muted); font-size:11px; white-space:nowrap; }
  #printSheet .ps-meta b { color:var(--text); font-weight:800; }
  #printSheet .ps-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin:12px 0 4px; }
  #printSheet .ps-kpi { border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  #printSheet .ps-kpi .k { color:var(--muted); font-size:10.5px; font-weight:800; letter-spacing:.2px; }
  #printSheet .ps-kpi .v { font-size:22px; font-weight:800; margin-top:3px; }
  #printSheet .ps-kpi .d { font-size:11px; font-weight:800; margin-top:2px; color:var(--muted); }
  #printSheet .ps-chart { margin:14px 0 6px; }
  #printSheet .ps-chart svg { width:100%; height:auto; }
  #printSheet .ps-chart .sc-wrap { position:relative; }
  #printSheet .ps-chart .tt { display:none; }
  #printSheet .ps-legend { color:var(--muted); font-size:12.5px; }
  #printSheet table { width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px; }
  #printSheet thead th { text-align:start; color:var(--muted); font-size:10.5px; font-weight:800; letter-spacing:.3px;
    padding:5px 6px; border-bottom:1.5px solid var(--line); background:none; position:static; }
  #printSheet td { padding:4px 6px; border-bottom:1px solid var(--soft); vertical-align:middle; }
  #printSheet th:nth-child(2), #printSheet td:nth-child(2) { width:58px; text-align:center; }
  #printSheet th:nth-child(3), #printSheet td:nth-child(3) { width:150px; }
  #printSheet th:nth-child(4), #printSheet td:nth-child(4) { width:78px; text-align:center; }
  #printSheet td.ps-nm { max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #printSheet td.ps-nm i { color:var(--muted); font-style:normal; }
  #printSheet .ps-cell { display:flex; align-items:center; gap:7px; }
  #printSheet .ps-bar { flex:1; height:7px; border-radius:5px; background:var(--track); overflow:hidden; }
  #printSheet .ps-bar i { display:block; height:100%; border-radius:5px; }
  #printSheet .ps-foot { display:flex; justify-content:space-between; gap:14px; margin-top:10px; padding-top:7px;
    border-top:1px solid var(--line); color:var(--muted); font-size:10.5px; }

  /* @page belongs at the top level of a stylesheet (Chrome ignores it nested in
     a media query), and it only ever applies while printing */
  @page { size:A4 portrait; margin:10mm; }
  @media print {
    .rv { opacity:1 !important; }
    .topbar, .bg, .themeflash, .help-wrap, .ticker, .splash { display:none !important; }
    /* `html.printsheet` is set by the Export PDF / Print button (and cleared on
       afterprint): that button prints the ONE-PAGE meeting sheet instead of the
       dashboard. A plain Ctrl+P keeps printing the dashboard itself — every
       item row included (see tablePaintAll). */
    html.printsheet, html.printsheet body { margin:0 !important; padding:0 !important; background:#fff !important; }
    html.printsheet body > *:not(#printSheet) { display:none !important; }
    html.printsheet #printSheet { position:static; inset:auto; width:auto; z-index:auto; visibility:visible; }
  }

  @media (max-width:860px) { .head-tools { align-items:flex-start; } .chart-grid > .card.wide { grid-column:span 1; } }
  @media (max-width:560px) { .phase-row { grid-template-columns:1fr; gap:5px; } .kpis { grid-template-columns:1fr 1fr; } .chart-grid { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion:reduce) {
    * { animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
    /* the ticker must not freeze mid-run: it becomes a still, scrollable strip
       (the second copy only exists to make the loop seamless) */
    .tk-track { animation:none !important; transform:none !important; }
    .tk-view { overflow-x:auto; }
    .tk-run + .tk-run { display:none; }
  }
</style>
</head>
<body>
<div class="topbar" aria-hidden="true"><i id="topbarFill"></i></div>
<div class="bg" aria-hidden="true">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  <span class="grid"></span><span class="beam"></span><span class="beam2"></span>
  <span class="dust" id="dust"></span>
  <span class="streaks" id="streaks"></span>
</div>
<div class="wrap">
  <div class="err" id="err"></div>

  <header>
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 17l5-5 3.5 3.5L21 6"/><path d="M15 6h6v6"/></svg></span>
      <div>
        <h1 data-i18n="title"></h1>
        <div class="sub"><span data-i18n="sub"></span> · <span id="stamp" class="num"></span></div>
      </div>
    </div>
    <div class="head-tools">
      <div class="tool-row">
        <div class="seg" role="group" aria-label="language">
          <button id="btnFa">FA</button><button id="btnEn">EN</button>
        </div>

/* ============================== sounds ==============================
   Two independent channels, both synthesised with Web Audio (no audio files,
   so the page stays a single HTML document):
     • UI sounds — the short click/pop/chime tones   → localStorage fgr-sound
     • Ambient   — a slow, quiet pad that never ends → localStorage fgr-ambient
   Browsers only allow audio after a real gesture, so the context is created
   on the first click/keypress (the module arms that listener itself). */
const SFX = (() => {
  let ctx = null, ui = null, pad = null, amb = null, wet = null, air = null;
  let uiOn = localStorage.getItem('fgr-sound') !== 'off';
  let ambOn = localStorage.getItem('fgr-ambient') === 'on';

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function impulse(sec, shape) {
    const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, shape);
    }
    return buf;
  }
  function noise(sec) {
    const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.4; }
    return buf;
  }

  /* one shared graph: UI tones straight out, ambient through its own fader */
  const ensure = () => {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      ui = ctx.createGain(); ui.gain.value = 0.16; ui.connect(ctx.destination);

      const toneFilter = ctx.createBiquadFilter();          // the pad's blanket
      toneFilter.type = 'lowpass'; toneFilter.frequency.value = 880; toneFilter.Q.value = 0.4;
      const lfo = ctx.createOscillator(), lfoDepth = ctx.createGain();
      lfo.frequency.value = 0.05; lfoDepth.gain.value = 260;   // slow "breathing" of the filter
      lfo.connect(lfoDepth); lfoDepth.connect(toneFilter.frequency); lfo.start();

      wet = ctx.createConvolver(); wet.buffer = impulse(3.4, 2.6);
      const wetGain = ctx.createGain(); wetGain.gain.value = 0.55;

      pad = ctx.createGain(); pad.gain.value = 1;
      amb = ctx.createGain(); amb.gain.value = 0;           // the ambient fader, faded in on start
      pad.connect(toneFilter); toneFilter.connect(amb);
      pad.connect(wet); wet.connect(wetGain); wetGain.connect(amb);
      amb.connect(ctx.destination);

      /* a whisper of air under the pad, so the silence feels like a room */
      air = ctx.createBufferSource(); air.buffer = noise(5); air.loop = true;
      const airLp = ctx.createBiquadFilter(); airLp.type = 'lowpass'; airLp.frequency.value = 420;
      const airGain = ctx.createGain(); airGain.gain.value = 0.22;
      air.connect(airLp); airLp.connect(airGain); airGain.connect(pad);
      air.start();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  function tone(freq, opts) {
    if (!uiOn) return;
    const o = opts || {};
    const c = ensure();
    if (!c) return;
    try {
      const t0 = c.currentTime + (o.delay || 0);
      const dur = o.dur || 0.09;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'triangle';
      osc.frequency.setValueAtTime(freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.5, t0 + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(ui);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    } catch {}
  }

  /* ----------------------------------------------------------------------
     ambient pad — four chords, twenty seconds each, forever. Voices overlap
     (a long fade in, a long fade out) so there is never a silent moment.
     ---------------------------------------------------------------------- */
  const PROG = [[50, 57, 62, 65], [46, 53, 58, 62], [41, 48, 53, 57], [43, 50, 55, 60]];
  const CHORD = 20, BELLS = [74, 77, 79, 81, 84];
  let step = -1, nextAt = 0, bellAt = 0, ticker = null, voices = [], playing = false;

  function chord(t0, notes) {
    for (const m of notes) {
      for (const [cents, type, gain] of [[-5, 'sine', 0.085], [6, 'triangle', 0.05]]) {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = type; osc.frequency.value = mtof(m); osc.detune.value = cents;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(gain, t0 + 5);
        g.gain.setValueAtTime(gain, t0 + CHORD);
        g.gain.linearRampToValueAtTime(0.0001, t0 + CHORD + 7);
        osc.connect(g); g.connect(pad);
        osc.start(t0); osc.stop(t0 + CHORD + 7.5);
        voices.push({ osc: osc, end: t0 + CHORD + 7.5 });
      }
    }
  }
  function bell(t0) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = mtof(BELLS[Math.floor(Math.random() * BELLS.length)]);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.05, t0 + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.6);
    osc.connect(g); g.connect(wet); g.connect(pad);
    osc.start(t0); osc.stop(t0 + 5);
    voices.push({ osc: osc, end: t0 + 5 });
  }
  function tick() {
    if (!playing || !ctx) return;
    const now = ctx.currentTime;
    if (now + 2 >= nextAt) { chord(nextAt, PROG[step = (step + 1) % PROG.length]); nextAt += CHORD; }
    if (now >= bellAt) { bell(now + 0.05); bellAt = now + 11 + Math.random() * 14; }
    voices = voices.filter((v) => v.end > now);
  }
  function start() {
    if (playing || !ambOn || !ensure()) return;
    playing = true;
    const now = ctx.currentTime;
    amb.gain.cancelScheduledValues(now);
    amb.gain.setValueAtTime(amb.gain.value, now);
    amb.gain.linearRampToValueAtTime(0.3, now + 3.5);
    nextAt = now + 0.4; bellAt = now + 7;
    if (!ticker) ticker = setInterval(tick, 1000);
    tick();
  }
  function stop() {
    if (!playing) return;
    playing = false;
    const now = ctx.currentTime;
    amb.gain.cancelScheduledValues(now);
    amb.gain.setValueAtTime(amb.gain.value, now);
    amb.gain.linearRampToValueAtTime(0, now + 2.2);
    setTimeout(() => {
      if (playing) return;
      if (ticker) { clearInterval(ticker); ticker = null; }
      voices.forEach((v) => { try { v.osc.stop(); } catch {} });
      voices = [];
    }, 2400);
  }

  /* browsers only lift the audio block on a real gesture, so the pad waits for
     the first click/keypress when the channel was left on during a last visit */
  window.addEventListener('pointerdown', start, { once: true, capture: true });
  window.addEventListener('keydown', start, { once: true, capture: true });

  return {
    get on() { return uiOn; },
    get ambientOn() { return ambOn; },
    /* true only once the context really runs: a browser lifts the audio block on
       a real gesture, and the splash must know whether its chime could play or
       has to wait for the first click */
    get live() { return !!ctx && ctx.state === 'running'; },
    toggle() {
      uiOn = !uiOn;
      try { localStorage.setItem('fgr-sound', uiOn ? 'on' : 'off'); } catch {}
      if (uiOn) { tone(880, { dur: 0.08, gain: 0.4, type: 'sine' }); tone(1320, { dur: 0.09, gain: 0.25, delay: 0.07, type: 'sine' }); }
      return uiOn;
    },
    toggleAmbient() {
      ambOn = !ambOn;
      try { localStorage.setItem('fgr-ambient', ambOn ? 'on' : 'off'); } catch {}
      if (ambOn) start(); else stop();
      return ambOn;
    },
    click:  () => tone(760, { dur: 0.055, gain: 0.32 }),
    pop:    () => tone(480, { dur: 0.13, gain: 0.45, to: 1020, type: 'sine' }),
    swish:  () => { tone(300, { dur: 0.22, gain: 0.35, to: 820, type: 'sine' }); tone(680, { dur: 0.16, gain: 0.22, to: 1360, delay: 0.05 }); },
    chime:  () => { tone(784, { dur: 0.2, gain: 0.45, type: 'sine' }); tone(1046, { dur: 0.28, gain: 0.4, type: 'sine', delay: 0.1 }); tone(1568, { dur: 0.24, gain: 0.2, type: 'sine', delay: 0.21 }); },
    /* the opening flourish: a quiet riser under a warm three-note chime, so it
       sits above the ambient pad without ever being loud */
    welcome: () => {
      tone(330,    { dur: 0.5,  gain: 0.2,  to: 660,  type: 'sine' });
      tone(660,    { dur: 0.45, gain: 0.12, to: 1320, delay: 0.12, type: 'sine' });
      tone(523.25, { dur: 0.42, gain: 0.3,  type: 'sine', delay: 0.3 });
      tone(659.25, { dur: 0.46, gain: 0.26, type: 'sine', delay: 0.42 });
      tone(783.99, { dur: 0.6,  gain: 0.24, type: 'sine', delay: 0.54 });
      tone(1567.98, { dur: 0.5, gain: 0.1,  type: 'sine', delay: 0.72 });
    },
    buzz:   () => { tone(190, { dur: 0.26, gain: 0.32, to: 90, type: 'sawtooth' }); },
  };
})();

/* ripple on any button */
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest && e.target.closest('button');
  if (!b) return;
  const rect = b.getBoundingClientRect();

  const r = document.createElement('span');

/* ============================ ambient background ============================
   Decoration only. The dust motes are built here so the markup stays short; they
   are plain <i> elements animated by CSS inside the .bg layer, which sits behind
   the content and cannot cover or dim anything the user needs to read. */
(function dust() {
  const host = $('dust');
  if (!host) return;
  let html = '';
  for (let i = 0; i < 13; i++) {
    html += '<i style="left:' + (Math.random() * 100).toFixed(2) + '%;' +
      '--s:' + (1.6 + Math.random() * 2.6).toFixed(1) + 'px;' +
      '--d:' + (46 + Math.random() * 52).toFixed(0) + 's;' +
      '--dl:-' + (Math.random() * 96).toFixed(0) + 's;' +
      '--dx:' + (Math.random() * 22 - 11).toFixed(1) + 'vw;' +
      '--o:' + (0.24 + Math.random() * 0.3).toFixed(2) + '"></i>';
  }
  let streaks = '';
  for (let i = 0; i < 5; i++) {
    streaks += '<span class="streak" style="top:' + (4 + Math.random() * 52).toFixed(1) + '%;' +
      'left:' + (Math.random() * 46).toFixed(1) + '%;' +
      '--r:' + (14 + Math.random() * 12).toFixed(1) + 'deg;' +
      '--d:' + (7 + Math.random() * 7).toFixed(1) + 's;' +
      '--dl:-' + (Math.random() * 26).toFixed(1) + 's"></span>';
  }
  host.innerHTML = html;
  const sk = $('streaks');
  if (sk) sk.innerHTML = streaks;
})();

function applyTheme(id, silent) {
  const next = THEMES.some((t) => t.id === id) ? id : 'mid';
  const changed = next !== THEME;
  THEME = next;

/* ============================== tips ticker ==============================
   The lower third at the bottom of the window. A handful of the page's tips is
   picked at RANDOM on every load (and again every couple of minutes) and the run
   is written TWICE, so travelling exactly one run width loops it without a seam.
   The pace is measured rather than fixed — the duration follows the run's own
   width, so a short run and a long run read at the same speed — and when the run
   is replaced the animation is re-seeded from its current phase, so a rotation
   never makes the text leap sideways. */
const TK = { folded: localStorage.getItem('fgr-ticker') === 'off', run: '', rot: null };
function tkPick(count) {
  const t = I18N[LANG];
  /* the one tip that needs the data stays out until the data is really in */
  const bag = t.tips.filter((s) => (DATA && TREE.get('')) || s.indexOf('{n}') < 0);
  for (let i = bag.length - 1; i > 0; i--) {          // Fisher–Yates, fresh every time
    const j = Math.floor(Math.random() * (i + 1));
    const s = bag[i]; bag[i] = bag[j]; bag[j] = s;
  }
  /* the count must be the one the PAGE shows (the project's leaf items), not
     DATA.tasks.length — the CSV also carries summary rows, so the raw row count
     read 245 while every KPI and the count chip said 226 */
  const root = DATA ? TREE.get('') : null;
  const n = root ? String(root.leaves.length) : '';
  /* every third slot is the SIGNATURE instead of a diamond separator: the credit
     travels inside the stream, but never looks like one more tip */
  const BY = '<span class="tk-by"><i class="st"></i><span class="k">' + esc(t.tkBy) +
    '</span><b>' + esc(t.spName) + '</b></span>';
  return bag.slice(0, count || 8).map((s, i) =>
    '<span class="tk-item">' + esc(s.replace(/\{n\}/g, n)) + '</span>' +
    ((i + 1) % 3 === 0 ? BY : '<i class="tk-sep"></i>')).join('');
}
function tkBuild(refresh) {
  const track = $('tkTrack');
  if (!track) return;
  const view = $('tkView');
  const draw = () => {
    track.innerHTML = '<div class="tk-run">' + TK.run + '</div><div class="tk-run">' + TK.run + '</div>';
    return track.scrollWidth / 2;                     // one run = the travel distance
  };
  if (refresh || !TK.run) { TK.run = tkPick(8); TK.n = 8; }
  let w = draw();
  /* one run has to be longer than the window, or the marquee shows a gap near
     the ends of its travel — on a very wide screen it simply takes more tips */
  const need = ((view ? view.clientWidth : 960) + 120) * 1.1;
  for (let guard = 0; w < need && TK.n < I18N[LANG].tips.length && guard < 5; guard++) { TK.run = tkPick(TK.n += 4); w = draw(); }
  const dur = Math.max(16, w / 68);                   // ~68 px per second
  let phase = 0;
  try {                                               // where the loop stands now
    const a = (track.getAnimations ? track.getAnimations() : [])
      .find((x) => x.animationName === 'tkLtr' || x.animationName === 'tkRtl');
    const d = a && a.effect && a.effect.getTiming().duration;
    if (d) phase = ((a.currentTime || 0) % d) / d;
  } catch {}
  track.style.setProperty('--tkDur', dur.toFixed(1) + 's');
  track.style.animation = 'none';                     // restart the keyframes…
  void track.offsetWidth;
  track.style.animation = '';
  track.style.animationDelay = -(phase * dur).toFixed(2) + 's';   // …at the same place
}
/* the first paint and every language switch come through here */
function tkPaint() {
  const host = $('ticker');
  if (!host) return;
  const t = I18N[LANG];
  host.setAttribute('aria-label', t.tkAria);
  document.documentElement.classList.toggle('tk-min', TK.folded);
  const fold = $('tkFold');
  if (fold) {
    fold.title = t[TK.folded ? 'tkShow' : 'tkHide'];
    fold.setAttribute('aria-label', fold.title);
    fold.setAttribute('aria-expanded', String(!TK.folded));
  }
  TK.run = '';                                        // the tips are language-bound
  if (!TK.folded) tkBuild(true);
  if (!TK.rot) TK.rot = setInterval(() => {
    if (!TK.folded && !document.hidden) tkBuild(true);   // a fresh handful now and then
  }, 75000);
}

/* ============================== welcome splash ==============================
   Shown the moment the page opens, gone a moment later. It follows what the UX
   guidance agrees on: no primary action (nothing to decide — but any click, any
   key or Esc leaves early), one simple on-brand image, roughly 2.5 s, and the
   numbers on the mark are the project's own (57 / 42). The credit arrives last,
   which is what makes it readable rather than busy. */
const SPLASH = { done: false, timer: null };
function splashOut() {
  const el = $('splash');
  if (!el || SPLASH.done) return;
  SPLASH.done = true;
  clearTimeout(SPLASH.timer);
  /* never hide an element that still holds focus: the browser blocks aria-hidden
     in that case (and it would strand a keyboard user inside a hidden overlay) */
  if (el.contains(document.activeElement) && document.activeElement.blur) document.activeElement.blur();
  el.classList.add('out');
  el.setAttribute('aria-hidden', 'true');
  /* off the tree once the fade is over: a transparent overlay would still sit in
     front of every click (and of the print sheet) */
  setTimeout(() => { el.style.display = 'none'; }, 950);
}
function splashInit() {
  const el = $('splash');
  if (!el) return;
  const t = I18N[LANG];
  if ($('spCard')) $('spCard').setAttribute('aria-label', t.spTitle + ' — ' + t.spName);
  if ($('spSkip')) $('spSkip').onclick = (e) => { e.stopPropagation(); splashOut(); SFX.click(); };
  el.addEventListener('pointerdown', splashOut);
  /* capture, so the first key only closes the splash and cannot also fire a
     dashboard shortcut behind it */
  addEventListener('keydown', (e) => { if (!SPLASH.done) { splashOut(); e.stopPropagation(); } }, { capture: true });
  SPLASH.timer = setTimeout(splashOut, MOTION_REDUCED ? 1300 : 2650);
  if (!SFX.on) return;
  /* a browser starts no audio without a gesture: when the chime cannot play now,
     the first click or key (usually the one that skips the splash) carries it,
     so the flourish is never simply lost */
  SFX.welcome();
  if (SFX.live) return;
  const once = () => { if (!SPLASH.done) SFX.welcome(); };
  addEventListener('pointerdown', once, { once: true, capture: true });
  addEventListener('keydown', once, { once: true, capture: true });
}

/* every keyboard shortcut in one place — T themes, M music, D drill up,
   F toggles the filter drawer, P prints the meeting sheet, ? (or H) toggles
   this guide, Escape closes the guide, the sound panel, the drawer and any
   open slicer/drill popover */
document.addEventListener('keydown', (e) => {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  /* Alt/Ctrl/Cmd belong to the browser: Ctrl+F is Find, Ctrl+P the native print,
     Ctrl+D/M/T/H its own shortcuts. Without this guard the page stole them all —
     Ctrl+P even printed the meeting sheet instead of the dashboard. */
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    soundPanel(false); closePops(); helpOpen(false);
    if (document.querySelector('.filters').classList.contains('open')) { filterDrawerOpen(false); SFX.click(); }
  }
  else if (e.key === 'm' || e.key === 'M') { SFX.toggleAmbient(); renderSound(); }
  else if (e.key === 'd' || e.key === 'D') drillUp();
  else if (e.key === 'f' || e.key === 'F') $('btnFilters').click();
  else if (e.key === 't' || e.key === 'T') applyTheme(THEMES[(THEMES.findIndex((x) => x.id === THEME) + 1) % THEMES.length].id);
  else if (e.key === 'p' || e.key === 'P') printSheet();
  else if (e.key === '?' || e.key === '؟' || e.key === 'h' || e.key === 'H') { helpToggle(); SFX.click(); }
});

/* ============================== data ============================== */
async function loadCsv(name) {
  let lastErr = null;
  for (const base of DATA_CANDIDATES) {
    try {
      const res = await fetch(base + name, { cache: 'no-store' });
      if (!res.ok) throw new Error(base + name + ' -> HTTP ' + res.status);
      return parseCsv((await res.text()).replace(/^\uFEFF/, ''));
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error(name);
}
function parseCsv(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); f = ''; rows.push(row); row = []; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const hdr = rows.shift() || [];
  return rows.filter((r) => r.length === hdr.length).map((r) => Object.fromEntries(hdr.map((h, i) => [h, r[i]])));
}
async function loadData() {
  const [tasks, pi] = await Promise.all([loadCsv('tasks.csv'), loadCsv('project-info.csv')]);
  return { tasks, stamp: pi[0]?.RefreshedAt ?? '' };
}

/* ============================== progress categories =============================
   The same four buckets the Power BI model's Progress Category exposes, derived
   here so the HTML slicers can filter by them:
     done = 100%    run = started    late = due, not started    next = not due yet */
const isLeaf = (r) => r.IsSummary === 'False' && r.IsMilestone === 'False';
const isMilestone = (r) => r.IsMilestone === 'True';
function catOf(r, status) {
  const a = num(r.ActualPercent);
  if (a >= 1) return 'done';
  if (a > 0) return 'run';
  return new Date(r.Finish).getTime() < status.getTime() ? 'late' : 'next';
}
const catLabel = (k) => { const c = CATS.find((x) => x.k === k); return c ? I18N[LANG][c.lbl] : k; };
function catsOf(rows, status) {
  const c = { done:0, run:0, late:0, next:0 };

/* ===== look-ahead =====  The standard construction look-ahead: of the CURRENT
   scope, the work that is NOT done yet and finishes inside the next N days from
   the status date. A window of 0 turns the strip off. Persisted separately from
   the filters — it is a reading, not a cut (the "focus" button is the cut). */
let LOOKAHEAD = 0;

function saveLa() { try { localStorage.setItem('fgr-la', String(LOOKAHEAD)); } catch {} }

  if (!days) return [];
  const t0 = status.getTime(), t1 = t0 + days * 86400000;
  return rows.filter((r) => {
    const a = num(r.ActualPercent);
    if (a >= 1) return false;                       // already done — not coming up
    const f = new Date(r.Finish).getTime();
    return isFinite(f) && f >= t0 && f <= t1;       // finishes inside the window
  });
}
function statusDate(tasks) {
  const row = (tasks || []).find((r) => r.StatusDate);

  return isFinite(d.getTime()) ? d : new Date();
}

/* ============================ period compare ============================
   The CSVs are a single snapshot, so "this month vs last month" is honest
   only as a READING of the reconstructed cumulative curves at two dates: the
   same buildSCurve math that draws the S-curve is evaluated at point A (the
   baseline) and point B (usually the status date). Deltas are B − A. Nothing
   here invents data — beyond the status date the actual curve stays flat by
   design, exactly like the chart itself. */
const CMP_PRESETS = [
  { k:'prevMonth', lbl:'cmpPrevMonth', short:'cmpSPrevMonth' },
  { k:'prevWeek',  lbl:'cmpPrevWeek',  short:'cmpSPrevWeek'  },
  { k:'prev30',    lbl:'cmpPrev30',    short:'cmpS30'        },
  { k:'custom',    lbl:'cmpCustom',    short:'cmpSCustom'    },

let CMP = { on:false, preset:'prevMonth', d1:'', d2:'' };
try {
  const s = JSON.parse(localStorage.getItem('fgr-cmp') || 'null');
  if (s && typeof s.on === 'boolean' && CMP_PRESETS.some((p) => p.k === s.preset)) CMP = Object.assign(CMP, s);
} catch {}
function saveCmp() { try { localStorage.setItem('fgr-cmp', JSON.stringify(CMP)); } catch {} }

function cmpRange(status) {
  if (!CMP.on) return null;
  const st = status.getTime();

    if (!CMP.d1 || !CMP.d2) return null;
    A = new Date(CMP.d1).getTime(); B = new Date(CMP.d2).getTime();
    if (!isFinite(A) || !isFinite(B)) return null;
  } else if (CMP.preset === 'prevMonth') {
    A = new Date(status.getFullYear(), status.getMonth(), 0, 23, 59, 59, 999).getTime();  // end of the previous calendar month
  } else {

function cmpDataFor(leaves, status) {
  const range = cmpRange(status);
  if (!range) return null;
  const sc = buildSCurve(leaves, status, [range.a, range.b]);
  if (!sc) return null;
  const at = (t) => {
    const pts = sc.pts;
    if (t <= pts[0].t) return { p: pts[0].p, a: pts[0].a };
    for (let i = 1; i < pts.length; i++) {
      if (pts[i].t >= t) {
        const p0 = pts[i - 1], p1 = pts[i], k = (t - p0.t) / Math.max(1, p1.t - p0.t);
        return { p: p0.p + (p1.p - p0.p) * k, a: p0.a + (p1.a - p0.a) * k };
      }
    }
    const l = pts[pts.length - 1];
    return { p: l.p, a: l.a };
  };
  const v1 = at(range.a), v2 = at(range.b);
  return { range, sc,
    p1: v1.p, a1: v1.a, p2: v2.p, a2: v2.a,
    dP: v2.p - v1.p, dA: v2.a - v1.a,
    dVar: (v2.a - v2.p) - (v1.a - v1.p) };

/* ============================== slicers (filters) ==============================
   Power BI-style filters. They cut the rows BEFORE the drill tree is built, so
   the KPIs, every chart, the table and the drill options all answer to them. */
const FIL = { phases:[], disc:[], status:[], from:'', to:'', q:'', num:[], rel:null, top:null, crit:false };
function filterActive() {
  return !!(FIL.phases.length || FIL.disc.length || FIL.status.length || FIL.from || FIL.to || FIL.q ||
    FIL.num.length || FIL.rel || FIL.top || FIL.crit);

// numeric comparisons a la Power BI (greater than / less than / equal / between ...)
const NUM_FIELDS = [
  { k:'WeightPercent', pct:true, lbl:'fltWeight' },
  { k:'ActualPercent', pct:true, lbl:'fltActualPct' },
  { k:'PlannedPercent', pct:true, lbl:'fltPlannedPct' },
  { k:'variance', pct:true, lbl:'fltVariance' },
  { k:'PhysicalPercentComplete', pct:true, lbl:'fltPhysical' },

const REL_UNITS = ['day', 'week', 'month', 'year'];
const TOP_BY = [
  { k:'weight', lbl:'fltWeight', get:(r) => num(r.WeightPercent) },
  { k:'actual', lbl:'fltActualPct', get:(r) => num(r.ActualPercent) },
  { k:'planned', lbl:'fltPlannedPct', get:(r) => num(r.PlannedPercent) },
  { k:'variance', lbl:'fltVariance', get:(r) => num(r.ActualPercent) - num(r.PlannedPercent) },

  return num(r[f]);
}

    case 'ge': return v >= a;
    case 'lt': return v < a;
    case 'le': return v <= a;
    case 'eq': return Math.abs(v - a) < 1e-9;

/* Power BI's relative-date slicer, anchored on the project status date (the

function relRange(rel, status) {
  const shift = (dt, n, unit) => {
    const x = new Date(dt.getTime());

    else if (unit === 'week') x.setDate(x.getDate() + n * 7);
    else if (unit === 'month') x.setMonth(x.getMonth() + n);

/* Top N is applied to the ITEMS (leaf rows) after the other filters, exactly

  const f = TOP_BY.find((x) => x.k === FIL.top.by) || TOP_BY[0];
  return leaves.slice().sort((a, b) => f.get(b) - f.get(a)).slice(0, FIL.top.n);

  const from = FIL.from ? new Date(FIL.from + 'T00:00:00').getTime() : null;
  const to = FIL.to ? new Date(FIL.to + 'T23:59:59').getTime() : null;
  const rel = FIL.rel ? relRange(FIL.rel, status) : null;
  return tasks.filter((r) => {
    if (FIL.phases.length && !FIL.phases.includes(r.Phase || '—')) return false;
    if (FIL.disc.length && !FIL.disc.includes(r.Disciplines || '—')) return false;
    if (!(opts && opts.ignoreStatus) && FIL.status.length && !FIL.status.includes(catOf(r, status))) return false;
    if (!(opts && opts.ignoreStatus) && FIL.crit && r.Critical !== 'True') return false;

/* ============================== drill tree ==============================
   level 0 whole project → level 1 phase → level 2 discipline, and the deepest
   level lists the leaf items themselves. Every node carries its own leaf rows,
   so ANY chart can be rendered for whatever node the user has drilled into. */

  const map = new Map([['', root]]);

    let n = map.get(key);
    if (!n) {
      n = { key, name, level, parent, path, leaves:[], children:[] };
      map.set(key, n);
      map.get(parent).children.push(n);
    }
    return n;
  };
  for (const r of leaves) {
    const p = r.Phase || '—', d = r.Disciplines || '—';
    ensure(p, p, 1, '', [p]).leaves.push(r);
    const key2 = ensure(p + SEP + d, d, 2, p, [p, d]);
    key2.leaves.push(r);
    /* the ITEM level is a real node too, so drilling down to a single task sticks
       instead of pointing at a key that is not in the tree */
    ensure(key2.key + SEP + 'i' + (r.UniqueID || r.TaskName), r.TaskName || '—', 3, key2.key, [p, d, r.TaskName]).leaves.push(r);
  }

}

  const rows = (node && node.leaves) || [];

}

  return (node && node.children) || [];
}

  if (!node || !node.level) return miles;
  return miles.filter((r) => r.Phase === node.path[0] && (node.path.length < 2 || r.Disciplines === node.path[1]));
}

/* ============================== animation helpers ============================== */
function animateNumber(el, to, fmt) {
  const from = el.__v ?? 0;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = fmt(to); return; }
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  /* safety net: if the page is not composited the frames may never run, so the
     final number is applied on a timer as well (same value once frames do run) */
  const token = (el.__t = (el.__t || 0) + 1);
  setTimeout(() => { if (el.__t === token) el.textContent = fmt(to); }, dur + 120);
  requestAnimationFrame(step);

function wireDrill(scope) {

/* the look-ahead strip: what of the CURRENT scope finishes within N days */
function renderLookahead(node, status) {
  const host = $('laStrip');
  if (!host) return;
  const t = I18N[LANG];
  const rows = LOOKAHEAD ? lookAheadOf(node.leaves.filter(isLeaf), status, LOOKAHEAD) : [];
  /* the date «فقط همین‌ها» writes into FIL.to — recomputed from the window, so
     «بازگشت به همه» can take back exactly that cut and never a hand-set date */
  const horizon = LOOKAHEAD ? isoDay(new Date(status.getTime() + LOOKAHEAD * 86400000)) : '';
  const cut = !!(horizon && FIL.to === horizon);
  const btns = [7, 14, 30].map((d) =>
    '<button class="lnk' + (LOOKAHEAD === d ? ' on' : '') + '" data-d="' + d + '" aria-pressed="' + (LOOKAHEAD === d) + '">' +
    d + ' ' + (LANG === 'fa' ? 'روز' : 'days') + '</button>').join('');
  host.innerHTML = '<span class="lbl">' + esc(t.laTitle) + '</span>' + btns +
    (LOOKAHEAD ? (rows.length
      /* the count gets its own noun so the line reads “1 item …” / “2 items …”
         instead of the old “1 روز آینده می‌رسد” */
      ? '<span class="num">' + rows.length + '</span><span class="lbl">' + esc(rows.length === 1 ? t.laItem : t.laItems) + ' ' + esc(t.laDays) + '</span>' +
        /* once the window IS the filter the button has nothing left to do, so it
           steps aside instead of looking like a dead control */
        (cut ? '' : '<button class="lnk" data-focus="1">' + esc(t.laFocus) + '</button>')
      : '<span class="lbl">' + esc(t.laNone) + '</span>') : '') +
    (LOOKAHEAD || cut ? '<button class="lnk" data-clear="1">' + esc(t.laClear) + '</button>' : '');
  host.querySelectorAll('[data-d]').forEach((b) => {
    b.onclick = () => {
      const d = parseInt(b.dataset.d, 10);
      LOOKAHEAD = LOOKAHEAD === d ? 0 : d;
      saveLa(); SFX.click(); render();
    };
  });
  const f = host.querySelector('[data-focus]');
  if (f) f.onclick = () => {
    /* the cut: turn the window into a real date-range filter (Finish ≤ horizon)
       so every chart, the table and the print sheet follow it. The range starts
       at the project start, so "from" never excludes anything already late. */
    FIL.to = isoDay(new Date(status.getTime() + LOOKAHEAD * 86400000));
    FIL.from = '';
    SFX.pop(); render();
  };
  const c = host.querySelector('[data-clear]');
  if (c) c.onclick = () => {
    /* “back to all” must mean back to all: the cut this strip itself made goes
       with it (a date window set by hand in the drawer is left alone) */
    if (cut) { FIL.to = ''; FIL.from = ''; }
    LOOKAHEAD = 0; saveLa(); SFX.click(); render();
  };
}

/* -------------------------------- s-curve --------------------------------
   Planned and actual cumulative progress over the project timeline. The planned
   curve is anchored on the model's own itemized planned % at the status date
   and lands on exactly 100% at the project finish; the actual curve is anchored
   on the reported actual % there and stays flat afterwards (no invented future
   progress). Both anchors use each task's Start/Finish span from the MPP. */
function buildSCurve(leaves, status, extra) {
  const DAY = 86400000;
  const rows = (leaves || []).filter((r) => isFinite(new Date(r.Start).getTime()) && isFinite(new Date(r.Finish).getTime()));
  if (!rows.length) return null;
  let t0 = Infinity, t1 = -Infinity;
  const k = rows.map((r) => {
    const s = new Date(r.Start).getTime(), f = new Date(r.Finish).getTime();
    if (s < t0) t0 = s;
    if (f > t1) t1 = f;
    return { w: num(r.WeightPercent), s, f, span: Math.max(DAY, f - s), pp: clamp01(num(r.PlannedPercent)), ap: clamp01(num(r.ActualPercent)) };
  });
  if (!(t1 > t0)) return null;
  const st = status.getTime();
  for (const q of k) q.a = clamp01((st - q.s) / q.span);
  const W = k.reduce((a, q) => a + q.w, 0) || 1;
  const planFrac = (q, t) => {
    const e = clamp01((t - q.s) / q.span);
    if (q.a >= 1) return e;
    if (t <= st) return q.a > 0 ? clamp01(q.pp * (e / q.a)) : 0;
    return clamp01(q.pp + (1 - q.pp) * ((e - q.a) / (1 - q.a)));
  };
  const actFrac = (q, t) => q.a > 0 ? clamp01(q.ap * Math.min(1, clamp01((t - q.s) / q.span) / q.a)) : (t >= st ? q.ap : 0);
  const step = Math.max(7 * DAY, Math.ceil((t1 - t0) / DAY / 150) * DAY);
  const times = [];
  for (let t = t0; t < t1; t += step) times.push(t);
  times.push(t1);
  if (st > t0 && st < t1) times.push(st);
  /* period compare: make the anchors EXACT points on the curve, not neighbours
     of a ~7-day sampling step */
  if (extra) for (const q of extra) if (q > t0 && q < t1) times.push(q);
  times.sort((a, b) => a - b);
  const pts = [];
  for (let i = 0; i < times.length; i++) {
    if (i && times[i] - times[i - 1] < DAY / 2) continue;
    let p = 0, a = 0;
    for (const q of k) { p += q.w * planFrac(q, times[i]); a += q.w * actFrac(q, times[i]); }
    pts.push({ t: times[i], p: p / W, a: a / W });
  }
  return { t0, t1, pts };
}
function chartSCurve(host, ctx) {
  const t = I18N[LANG];
  const cmp = CMP.on ? cmpDataFor(ctx.node.leaves, ctx.status) : null;
  const sc = cmp ? cmp.sc : buildSCurve(ctx.node.leaves, ctx.status);
  if (!sc) { host.innerHTML = '<div class="empty">' + esc(t.empty) + '</div>'; return; }
  /* the margins are sized for the TEXT, not for the plot: a 12 px tick or the
     status-line label needs its own room, so the box is a little taller than it
     used to be rather than squeezing the curve to pay for the labels */
  const W = 720, H = 272, L = 58, R = 16, T = 20, B = 42;
  const x = (tt) => L + (tt - sc.t0) / (sc.t1 - sc.t0) * (W - L - R);
  const y = (v) => T + (1 - clamp01(v)) * (H - T - B);
  let svg = '';
  for (const v of [0, 0.25, 0.5, 0.75, 1]) {
    const yy = y(v);
    svg += '<line class="gl' + (v === 0 ? ' gl0' : '') + '" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>' +
      '<text class="at" x="' + (L - 8) + '" y="' + (yy + 3.4).toFixed(1) + '" text-anchor="end">' + (v * 100) + '%</text>';
  }
  const N = 6;
  for (let i = 0; i <= N; i++) {
    const tt = sc.t0 + (sc.t1 - sc.t0) * i / N, xx = x(tt);
    const anchor = i === 0 ? 'start' : i === N ? 'end' : 'middle';
    svg += '<line class="gl" x1="' + xx.toFixed(1) + '" y1="' + y(0).toFixed(1) + '" x2="' + xx.toFixed(1) + '" y2="' + (y(0) + 4).toFixed(1) + '"/>' +
      '<text class="at" x="' + xx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '">' + esc(fmtDay(new Date(tt))) + '</text>';
  }
  let pos = '', neg = '';
  const quad = (dir, xa, pa, aa, xb, pb, ab) => {
    const d = 'M' + xa.toFixed(1) + ' ' + pa.toFixed(1) + 'L' + xb.toFixed(1) + ' ' + pb.toFixed(1) +
      'L' + xb.toFixed(1) + ' ' + ab.toFixed(1) + 'L' + xa.toFixed(1) + ' ' + aa.toFixed(1) + 'Z';
    if (dir < 0) neg += d; else pos += d;
  };
  for (let i = 0; i < sc.pts.length - 1; i++) {
    const p1 = sc.pts[i], p2 = sc.pts[i + 1];
    const v1 = p1.a - p1.p, v2 = p2.a - p2.p;
    const x1 = x(p1.t), x2 = x(p2.t);
    const pa1 = y(p1.p), aa1 = y(p1.a), pa2 = y(p2.p), aa2 = y(p2.a);
    if (v1 === 0 && v2 === 0) continue;
    if (v1 * v2 >= 0) { quad(v2, x1, pa1, aa1, x2, pa2, aa2); }
    else {
      const kk = Math.abs(v1) / (Math.abs(v1) + Math.abs(v2));
      const xc = x1 + (x2 - x1) * kk, yc = pa1 + (pa2 - pa1) * kk;
      quad(v1, x1, pa1, aa1, xc, yc, yc);
      quad(v2, xc, yc, yc, x2, pa2, aa2);
    }
  }
  const line = (key) => sc.pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p[key]).toFixed(1)).join('');
  const sx = Math.min(W - R, Math.max(L, x(sc.status || ctx.status.getTime())));
  const lblx = Math.min(W - R - 32, Math.max(L + 32, sx));
  /* period compare: shade the A..B span, mark BOTH points on BOTH curves —
     A hollow (the baseline), B solid — and read the deltas in chips below */
  if (cmp) {
    const ax = Math.min(W - R, Math.max(L, x(cmp.range.a)));
    const bx = Math.min(W - R, Math.max(L, x(cmp.range.b)));
    svg += '<rect class="bandAB" x="' + ax.toFixed(1) + '" y="' + T + '" width="' + Math.max(1, bx - ax).toFixed(1) + '" height="' + (y(0) - T).toFixed(1) + '"/>' +
      /* a slim dashed guide at A: over a multi-year project the A→B span is only
         a few pixels wide, so the baseline date needs its own line to be read */
      '<line class="nowA" x1="' + ax.toFixed(1) + '" y1="' + T + '" x2="' + ax.toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>';
    const side = (xx) => (xx > W - R - 12 ? -10 : 4);   // keep the A/B tag inside the plot
    svg += '<circle class="markA dot-a-hint" cx="' + ax.toFixed(1) + '" cy="' + y(cmp.a1).toFixed(1) + '" r="4"/>' +
      '<circle class="markA dot-p-hint" cx="' + ax.toFixed(1) + '" cy="' + y(cmp.p1).toFixed(1) + '" r="4"/>' +
      '<circle class="markB" cx="' + bx.toFixed(1) + '" cy="' + y(cmp.a2).toFixed(1) + '" r="4.6"/>' +
      '<circle class="markB" cx="' + bx.toFixed(1) + '" cy="' + y(cmp.p2).toFixed(1) + '" r="4.6"/>' +
      '<text class="marklbl" x="' + (ax + side(ax)).toFixed(1) + '" y="' + (y(Math.max(cmp.a1, cmp.p1)) - 7).toFixed(1) + '">A</text>' +
      '<text class="marklbl" x="' + (bx + side(bx)).toFixed(1) + '" y="' + (y(Math.max(cmp.a2, cmp.p2)) - 7).toFixed(1) + '">B</text>';
  }
  svg += '<path class="rb-neg" d="' + neg + '"/><path class="rb-pos" d="' + pos + '"/>' +
    '<path class="s-plan" d="' + line('p') + '"/><path class="s-act" d="' + line('a') + '"/>' +
    '<line class="now" x1="' + sx.toFixed(1) + '" y1="' + T + '" x2="' + sx.toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>' +
    '<text class="nowlbl" x="' + lblx.toFixed(1) + '" y="' + (T + 9) + '" text-anchor="middle">' + esc(t.scNow) + '</text>' +
    '<line class="guide" x1="0" y1="' + T + '" x2="0" y2="' + y(0).toFixed(1) + '"/>' +
    '<circle class="dot dot-p" cx="0" cy="0" r="3.4" opacity="0"/><circle class="dot dot-a" cx="0" cy="0" r="3.4" opacity="0"/>' +
    '<circle class="dot dot-p pop" cx="' + sx.toFixed(1) + '" cy="' + y(ctx.s.planned).toFixed(1) + '" r="4.4"/>' +
    '<circle class="dot dot-a pop" cx="' + sx.toFixed(1) + '" cy="' + y(ctx.s.actual).toFixed(1) + '" r="4.4"/>';
  host.innerHTML = '<div class="sc-wrap"><svg class="sc" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t.chartSCurve) + '">' + svg + '</svg>' +
    '<div class="tt" id="scTT"></div></div>' +
    '<div class="sc-legend">' +
      '<span><span class="ln" style="background:var(--blue)"></span>' + esc(t.scPlanned) + '</span>' +
      '<span><span class="ln" style="background:var(--green)"></span>' + esc(t.scActual) + '</span>' +
      '<span><span class="ln" style="background:var(--amber)"></span>' + esc(t.scNow) + '</span>' +
      (cmp ? '<span class="num"><span class="ln" style="background:var(--amber);opacity:.45"></span>' + esc(t.cmpBand) + ': ' + esc(cmpShort()) + '</span>' : '') +
    '</div>';
  const svgEl = host.querySelector('svg.sc'), tt = $('scTT'), guide = svgEl.querySelector('.guide');
  /* The chart ships a fixed viewBox, so SVG text would shrink with the card — a
     narrow window ended up with ~8 px ticks. Fixing the SHEET font-size in user
     units keeps the numbers at ~12 px rendered at any card width. */
  const fitText = () => {
    const k = svgEl.clientWidth / W;
    if (!(k > 0)) return;
    /* aim for 13 px of rendered text, letting it grow to 16 px on a wide card */

    svgEl.style.fontSize = Math.min(26, Math.max(4, want / k)).toFixed(2) + 'px';

  /* the two cumulative lines are drawn in: measure each path so the dash sweep
     ends exactly on the real curve. Measuring is pure geometry, and if it ever
     fails the lines simply stay solid — the chart never loses data. */
  try {
    const pEl = svgEl.querySelector('.s-plan'), aEl = svgEl.querySelector('.s-act');
    const lp = pEl.getTotalLength(), la = aEl.getTotalLength();
    if (lp > 8 && la > 8) {
      svgEl.style.setProperty('--plen', lp.toFixed(1));

      svgEl.classList.add('draw');
    }
  } catch (e) { /* leave the lines drawn */ }
  const dots = svgEl.querySelectorAll('circle[opacity="0"]');
  const xs = sc.pts.map((p) => x(p.t));
  const fmt = (v) => (100 * v).toFixed(1) + '%';
  svgEl.addEventListener('mousemove', (e) => {
    const rect = svgEl.getBoundingClientRect();
    const vx = (e.clientX - rect.left) / rect.width * W;
    let lo = 0, hi = xs.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] < vx) lo = mid; else hi = mid; }
    const i = Math.abs(xs[lo] - vx) <= Math.abs(xs[hi] - vx) ? lo : hi;
    const p = sc.pts[i], dv = p.a - p.p;
    guide.setAttribute('x1', xs[i].toFixed(1)); guide.setAttribute('x2', xs[i].toFixed(1)); guide.style.opacity = '.5';
    dots[0].setAttribute('cx', xs[i].toFixed(1)); dots[0].setAttribute('cy', y(p.p).toFixed(1)); dots[0].setAttribute('opacity', '1');
    dots[1].setAttribute('cx', xs[i].toFixed(1)); dots[1].setAttribute('cy', y(p.a).toFixed(1)); dots[1].setAttribute('opacity', '1');
    tt.innerHTML = '<div class="h num">' + esc(fmtDay(new Date(p.t), true)) + '</div>' +
      '<div class="r"><span class="k">' + esc(t.scPlanned) + '</span><span class="num">' + fmt(p.p) + '</span></div>' +
      '<div class="r"><span class="k">' + esc(t.scActual) + '</span><span class="num">' + fmt(p.a) + '</span></div>' +
      '<div class="r"><span class="k">' + esc(t.gaugeVar) + '</span><span class="num" style="color:' + (dv >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (dv >= 0 ? '+' : '') + (100 * dv).toFixed(1) + 'pp</span></div>';
    tt.style.left = (xs[i] / W * 100).toFixed(2) + '%';
    tt.style.top = (Math.min(y(p.p), y(p.a)) / H * 100).toFixed(2) + '%';
    tt.classList.add('on');
  });
  svgEl.addEventListener('mouseleave', () => {
    tt.classList.remove('on');
    guide.style.opacity = '0';
    dots.forEach((d) => d.setAttribute('opacity', '0'));
  });
}

/* ----------------------------- variance bars ----------------------------- */
function chartVariance(host, ctx) {
